name: Vector backend contract tests

# Runs the Frappe-free tests: the shared contract suite for every vector backend (pgvector against
# a real Postgres, LanceDB, Chroma) and the database-portability guard. The full app suite needs a
# bench and is run separately on MariaDB and on Postgres (see docs/setup.md).

on:
  push:
    paths:
      - "frappe_ai/vector/**"
      - "frappe_ai/tests/test_vector_contract.py"
      - "frappe_ai/tests/test_database_portability.py"
      - "frappe_ai/utils/like.py"
      - ".github/workflows/vector-contract.yml"
  pull_request:
    paths:
      - "frappe_ai/vector/**"
      - "frappe_ai/tests/test_vector_contract.py"
      - "frappe_ai/tests/test_database_portability.py"
      - "frappe_ai/utils/like.py"
      - ".github/workflows/vector-contract.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FRAPPE_AI_TEST_PG_DSN: host=localhost port=5432 user=postgres password=postgres dbname=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lancedb pyarrow chromadb "psycopg[binary]"
      - run: python -m unittest frappe_ai.tests.test_vector_contract frappe_ai.tests.test_database_portability -v
