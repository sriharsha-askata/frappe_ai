[project]
name = "frappe_ai"
authors = [
    { name = "Asakta", email = "askata@asakta.com"}
]
description = "frappe ai"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
    # Provider-name validation and model-id suggestions only — same pin as
    # apps/flow/pyproject.toml. Chat calls still go through Agno's native
    # per-provider classes; see docs/decisions/0013-litellm-for-provider-ux-agno-still-executes.md.
    "litellm>=1.83.0,<1.83.8",
    "agno>=2.8,<3",
    "RestrictedPython>=8.4,<9",
    "pydantic>=2.11,<3",
    "fastapi>=0.115,<1",
    # Plain uvicorn, not the [standard] extra — its optional deps (uvloop,
    # httptools, websockets, watchfiles) aren't needed for this SSE-over-plain-HTTP
    # service, and pulling `websockets` collides with `commit`'s pinned
    # `pyppeteer` (websockets<11) elsewhere in this bench's shared venv.
    "uvicorn>=0.34,<1",
    # Already present transitively in this bench; declared explicitly since
    # frappe_ai/service/frappe_client.py depends on it directly.
    "httpx>=0.27,<1",
    # Knowledge/RAG pipeline (Phase 4) — same pins as apps/flow/pyproject.toml.
    # No litellm for embeddings either — see docs/decisions/0012-embeddings-direct-provider-sdk.md.
    "lancedb<1,>=0.33",
    "python-docx<2,>=1.1",
    "pdfplumber<1,>=0.10",
    "rapidocr<4,>=3",
    "onnxruntime<2,>=1.27",
    "openpyxl>=3.1,<4",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "chardet>=5,<6",
    "croniter>=2,<7",
    "mcp>=1,<2",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

# These apt dependencies will be installed from Ubuntu repositories when you host your app on Frappe Cloud
[deploy.dependencies.apt]
packages = ["libgl1", "libglib2.0-0"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
    "UP030", # Use implicit references for positional format fields (translations)
    "UP031", # Use format specifiers instead of percent format
    "UP032", # Use f-string instead of `format` call (translations)
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
